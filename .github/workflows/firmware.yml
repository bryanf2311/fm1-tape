name: firmware
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install JieLi toolchain 2.5.3 (extract the Inno installer; never run it)
        shell: pwsh
        timeout-minutes: 20
        run: |
          choco install innoextract -y --no-progress
          curl.exe --fail --location --retry 3 -o "$env:RUNNER_TEMP\jl.exe" https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          innoextract --silent -d C:\jlx "$env:RUNNER_TEMP\jl.exe"
          $clang = Get-ChildItem C:\jlx -Recurse -Filter clang.exe | Where-Object { $_.FullName -match 'pi32\\bin' } | Select-Object -First 1
          if (-not $clang) { Get-ChildItem C:\jlx -Recurse -Directory | Select-Object -First 40 | ForEach-Object FullName; throw 'pi32 clang.exe not found' }
          $pi32 = Split-Path (Split-Path $clang.FullName)
          "FM1_PI32_TOOLCHAIN=$pi32" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "toolchain: $pi32"
          (Get-FileHash $clang.FullName -Algorithm SHA256).Hash
      - name: Build browser preview + packaged firmware
        shell: cmd
        timeout-minutes: 40
        env:
          FM1_SOURCE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: |
          rem build.bat starts Windows PowerShell 5.1; pwsh 7's module path would hide Get-FileHash.
          set "PSModulePath=%ProgramFiles%\WindowsPowerShell\Modules;%SystemRoot%\system32\WindowsPowerShell\v1.0\Modules"
          call build.bat --web
          if errorlevel 1 exit /b 1
          call build.bat --package
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-tape-firmware
          path: |
            build/official-web/**
            build/dx7/*.fwsc
            build/dx7/firmware-report.json
            build/preview/**
          if-no-files-found: warn
